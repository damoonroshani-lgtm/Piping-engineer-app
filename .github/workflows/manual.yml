

name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android platform
        run: flutter create --platforms=android .

      - name: Get dependencies
        run: flutter pub get

      - name: Find Gradle files
        run: |
          echo "Checking Gradle files..."
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -print

      - name: Build APK
        run: flutter build apk --release

      - name: Inspect APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          echo "Checking APK file..."
          ls -lh "$APK"
          file "$APK"

          echo "Checking APK archive..."
          unzip -t "$APK" | tail -n 2

          echo "Checking APK package information..."
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | head -n 20

          echo "Checking APK digital signature..."
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Piping-Engineering-APK
          path: build/app/outputs/flutter-apk/app-release.apk
